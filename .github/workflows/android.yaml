      - name: Upload Release AAR
        uses: actions/upload-artifact@v4
        with:
          name: release-aar-feature-platform
          path: feature/platform/**/build/outputs/aar/*-release.aar
          if-no-files-found: error
      - name: Upload Debug AAR
        uses: actions/upload-artifact@v4
        with:
          name: debug-aar-feature-platform
          path: feature/platform/**/build/outputs/aar/*-debug.aar
          if-no-files-found: ignore

  # =============================================================================
  # NIVEL 3: VITRINE & COMMERCE & FIDELIDADE
  # =============================================================================

  feature-storefront:
    name: "feature: storefront"
    needs: [feature-platform]
    runs-on: ubuntu-latest
    permissions:
