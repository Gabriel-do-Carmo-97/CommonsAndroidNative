  # =============================================================================
  # NIVEL 2: PLATAFORMA & TELEMETRIA TRANSVERSAL
  # =============================================================================

  feature-platform:
    name: "feature: platform"
    needs: [feature-auth, feature-account, feature-system]
    runs-on: ubuntu-latest
    permissions:
