  # =============================================================================
  # NIVEL 4: LOGISTICA, COMUNICACAO & SERVICOS
  # =============================================================================

  feature-delivery:
    name: "feature: delivery"
    needs: [feature-platform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: true }
      - name: Setup Android & Java Environment
        uses: ./.github/actions/setup-android-env
      - name: Detekt, Lint, Testes e Build
        run: |
          ./gradlew \
            :feature:delivery:order-tracking:detekt \
            :feature:delivery:order-tracking:lintDebug \
            :feature:delivery:order-tracking:testDebugUnitTest \
            :feature:delivery:order-tracking:assembleRelease \
            :feature:delivery:order-tracking:assembleDebug \
            :feature:delivery:maps:detekt \
            :feature:delivery:maps:lintDebug \
            :feature:delivery:maps:testDebugUnitTest \
            :feature:delivery:maps:assembleRelease \
            :feature:delivery:maps:assembleDebug \
