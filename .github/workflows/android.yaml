          name: reports-bundle-${{ matrix.domain }}
          path: |
            bundles/${{ matrix.domain }}/**/build/reports/tests/
            bundles/${{ matrix.domain }}/**/build/reports/detekt/
            bundles/${{ matrix.domain }}/**/build/reports/lint-results*.html
          if-no-files-found: ignore
      - name: Upload Release AAR
        uses: actions/upload-artifact@v4
