name: Android Publish Commons Libraries

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build_Test_and_Publish:

    name: Build, Test and Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed modules
        id: changed_modules
        uses: tj-actions/changed-files@v47
        with:
          files: |
            authentication/**
            biometric/**
            cart/**
            catalog/**
            feedback/**
            force-update/**
            loyalty/**
            maps/**
            media-picker/**
            message/**
            onboarding/**
            order-tracking/**
            payment/**
            profile/**
            promotions/**
            quotation/**
            reviews-store/**
            scheduling/**
            search/**
            settings/**
            stores/**
            whatsapp-direct/**

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: 🧪 Run Unit Tests
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: ./gradlew testDebugUnitTest

      - name: Build with Gradle
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: ./gradlew assembleRelease

      - name: ⬆️ Upload Release AARs as Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-aars
          path: ./**/build/outputs/aar/*-release.aar
          if-no-files-found: ignore

      - name: 📦 Publish Changed Libraries to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.changed_modules.outputs.any_changed == 'true'
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: |
          for module in authentication biometric cart catalog feedback force-update loyalty maps media-picker message onboarding order-tracking payment profile promotions quotation reviews-store scheduling search settings stores whatsapp-direct; do
            if echo "${{ steps.changed_modules.outputs.all_changed_files }}" | grep -q "$module/"; then
              echo "Publishing :$module to GitHub Packages..."
              ./gradlew ":$module:publish" --no-daemon
            fi
          done

      - name: Configure GitHub Access
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Create Git Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v0.0.${{ github.run_number }}"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v0.0.${{ github.run_number }}"
          AAR_FILES=$(find . -path '*/build/outputs/aar/*-release.aar' | tr '\n' ' ')
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --notes "Release automático. Mudanças detectadas em: ${{ steps.changed_modules.outputs.all_changed_files }}." \
            $AAR_FILES
