            :feature:account:onboarding:testDebugUnitTest \
            :feature:account:onboarding:assembleRelease \
            :feature:account:onboarding:assembleDebug \
            :feature:account:profile:detekt \
            :feature:account:profile:lintDebug \
            :feature:account:profile:testDebugUnitTest \
            :feature:account:profile:assembleRelease \
            :feature:account:profile:assembleDebug \
            :feature:account:settings:detekt \
            :feature:account:settings:lintDebug \
            :feature:account:settings:testDebugUnitTest \
