name: Android CI/CD Pipeline (Hyper-Granular Pro)

on:
  push:
    branches: [ "master", "feat/**" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GPR_USER: ${{ secrets.GPR_USER || github.actor }}
  GPR_KEY: ${{ secrets.GPR_KEY || secrets.GITHUB_TOKEN }}

jobs:
  # =============================================================================
  # PR VALIDATION: CONVENTIONAL COMMITS
  # =============================================================================

  semantic-pull-request:
    name: "PR: Validate Conventional Title"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            ci
            perf
            build
          requireScope: false

  # =============================================================================
  # NIVEL 1: FUNDACAO & IDENTIDADE
  # =============================================================================

  feature-auth:
    name: "feature: auth"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: true }
      - name: Setup Android & Java Environment
        uses: ./.github/actions/setup-android-env
      - name: Detekt, Lint, Testes e Build
        run: |
          ./gradlew \
            :feature:auth:authentication:detekt \
            :feature:auth:authentication:lintDebug \
            :feature:auth:authentication:testDebugUnitTest \
            :feature:auth:authentication:assembleRelease \
            :feature:auth:authentication:assembleDebug \
            :feature:auth:biometric:detekt \
            :feature:auth:biometric:lintDebug \
            :feature:auth:biometric:testDebugUnitTest \
            :feature:auth:biometric:assembleRelease \
            :feature:auth:biometric:assembleDebug
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-feature-auth
          path: |
            feature/auth/**/build/reports/tests/
            feature/auth/**/build/reports/detekt/
            feature/auth/**/build/reports/lint-results*.html
          if-no-files-found: ignore
      - name: Upload Release AAR
        uses: actions/upload-artifact@v4
        with:
          name: release-aar-feature-auth
          path: feature/auth/**/build/outputs/aar/*-release.aar
          if-no-files-found: error
      - name: Upload Debug AAR
        uses: actions/upload-artifact@v4
        with:
          name: debug-aar-feature-auth
          path: feature/auth/**/build/outputs/aar/*-debug.aar
          if-no-files-found: ignore

  feature-account:
    name: "feature: account"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: true }
      - name: Setup Android & Java Environment
        uses: ./.github/actions/setup-android-env
      - name: Detekt, Lint, Testes e Build
        run: |
          ./gradlew \
            :feature:account:onboarding:detekt \
