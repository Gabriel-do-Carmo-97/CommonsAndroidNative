  # =============================================================================
  # NIVEL 5: COMMERCIAL BUNDLES (MATRIZ PARALELA POR DOMINIO)
  # =============================================================================

  bundles:
    name: "bundle: ${{ matrix.domain }}"
    needs:
      - feature-auth
      - feature-account
      - feature-system
      - feature-platform
      - feature-storefront
      - feature-checkout
      - feature-customer
      - feature-delivery
      - feature-communication
      - feature-services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        domain:
          - identity
          - foundation
          - ecommerce
          - delivery
          - services
          - communication
          - subscriptions
          - social
          - education
          - health
          - finance
          - events
          - real-estate
          - emergency
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: true }
      - name: Setup Android & Java Environment
        uses: ./.github/actions/setup-android-env
      - name: Detekt, Lint, Testes e Build do Bundle (${{ matrix.domain }})
        run: |
          ./gradlew \
            :bundles:${{ matrix.domain }}:basic:detekt \
            :bundles:${{ matrix.domain }}:basic:lintDebug \
            :bundles:${{ matrix.domain }}:basic:testDebugUnitTest \
            :bundles:${{ matrix.domain }}:basic:assembleRelease \
            :bundles:${{ matrix.domain }}:basic:assembleDebug \
            :bundles:${{ matrix.domain }}:standard:detekt \
            :bundles:${{ matrix.domain }}:standard:lintDebug \
            :bundles:${{ matrix.domain }}:standard:testDebugUnitTest \
            :bundles:${{ matrix.domain }}:standard:assembleRelease \
            :bundles:${{ matrix.domain }}:standard:assembleDebug \
            :bundles:${{ matrix.domain }}:pro:detekt \
            :bundles:${{ matrix.domain }}:pro:lintDebug \
            :bundles:${{ matrix.domain }}:pro:testDebugUnitTest \
            :bundles:${{ matrix.domain }}:pro:assembleRelease \
            :bundles:${{ matrix.domain }}:pro:assembleDebug
