build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  active: true
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
  LargeClass:
    active: true
    threshold: 300
  LongMethod:
    active: true
    threshold: 60
  CyclomaticComplexMethod:
    active: true
    threshold: 15

naming:
  active: true
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    excludeClassPattern: '$^'

style:
  active: true
  UnusedImports:
    active: true
  WildcardImport:
    active: true
    excludeImports: ['java.util.*', 'kotlinx.coroutines.*']
